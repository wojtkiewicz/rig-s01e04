name: Deploy digest preview

on:
  workflow_dispatch:
    inputs:
      lane_marker:
        description: Leave empty for the marker-free replacement.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run rig and save the digest page
        env:
          LANE_MARKER: ${{ inputs.lane_marker }}
        run: |
          set -euo pipefail
          pnpm start > /tmp/rig.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8787/health >/dev/null; then
              break
            fi
            sleep 1
          done

          mkdir -p dist
          curl --fail --silent --show-error \
            http://127.0.0.1:8787/digest/2026-10-28 \
            --output dist/index.html
          test -s dist/index.html

          if [ -n "$LANE_MARKER" ]; then
            grep -F -- "$LANE_MARKER" dist/index.html
          else
            grep -F 'no marker set' dist/index.html
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload page artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
